[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cqgt"
version = "0.1.0"
description = "Causal Quantum Graph Transformers for systemic credit-risk contagion prediction — reproducible benchmark and reference implementation."
requires-python = ">=3.12"
readme = "README.md"

[tool.setuptools.packages.find]
include = ["cqgt*", "baselines*", "data*", "experiments*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
